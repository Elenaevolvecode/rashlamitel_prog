name: Тесты и сборка Windows

on:
  push:
    branches: ['**']
    tags: ['v*']   # тег vX.Y.Z — публикуем релиз с установщиком
  workflow_dispatch:

permissions:
  contents: write  # нужно только для публикации релиза по тегу

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка установщика
        run: npm run build:win

      - name: Установщик — скачать здесь
        uses: actions/upload-artifact@v4
        with:
          name: Rashlamitel-Setup
          path: dist/*.exe
          retention-days: 14

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -like 'Rashlamitel-Setup-*' } | Select-Object -First 1
          gh release create $tag $exe.FullName --title "Расхламитель ПК $($tag.TrimStart('v'))" --notes-file docs/RELEASE_NOTES.md --latest
